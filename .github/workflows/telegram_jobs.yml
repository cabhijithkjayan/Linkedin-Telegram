name: Telegram Jobs to LinkedIn

on:
  schedule:
    # GitHub cron is in UTC. IST = UTC+5:30
    - cron: "30 3 * * *"   # 09:00 AM IST
    - cron: "30 8 * * *"   # 02:00 PM IST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (log only, do not post)"
        type: boolean
        default: false
      skip_backlog:
        description: "Skip all existing posts (mark as done, post nothing) - use once before going live"
        type: boolean
        default: false

concurrency:
  group: telegram-jobs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Post new Telegram job posts to LinkedIn
        env:
          TBOT_KEY: ${{ secrets.TBOT_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          JOBS_CHAT_ID: "-1004296140869"
          JOBS_MAX_POSTS: "10"   # max LinkedIn posts per run; extras wait for the next run
          # Optional: JOBS_OPENAI_MODEL: "gpt-4o"
        run: python telegram_jobs.py ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.skip_backlog && '--skip-backlog' || '' }}

      - name: Save state
        if: ${{ always() && !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add telegram_jobs_state.json || true
          git diff --cached --quiet || (git commit -m "Update telegram jobs state" && git pull --rebase && git push)
